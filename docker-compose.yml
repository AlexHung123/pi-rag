services:
  postgres:
    image: postgres:16-alpine
    container_name: pi-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pi_rag
      POSTGRES_PASSWORD: pi_rag
      POSTGRES_DB: pi_rag
    ports:
      - "5432:5432"
    volumes:
      - pi_rag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_rag -d pi_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pi_rag_pg:
